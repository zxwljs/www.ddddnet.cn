name: SEO Blog Auto Generator

# 每小时自动生成一篇 SEO 文章，推送后 Cloudflare Pages 自动部署
on:
  schedule:
    - cron: '0 * * * *'  # UTC 每整点执行（每小时1篇）
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write  # 允许自动提交推送

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 SEO 文章
        env:
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
        run: node scripts/generate-seo.js

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml scripts/generated.json scripts/topics-hot.json
          git commit -m "chore(seo): auto-generate blog post $(date -u '+%Y-%m-%d %H:%M')"
          git push
